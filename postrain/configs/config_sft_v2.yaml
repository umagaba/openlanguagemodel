# Configuration for Qwen2.5-0.5B Guardrail SFT v2 (Curated Data + Scaled LoRA r=64)
base_model:
  path: "examples/qwen2_5-0_5b-fineweb-edu-10b/checkpoints/qwen_0_5b_final_epoch2.pt"

training:
  batch_size: 16
  gradient_accumulation_steps: 2
  epochs: 3
  max_steps: 2000
  lr: 3.0e-5
  device: "cuda"
  use_amp: true
  grad_clip_norm: 1.0

optimizer:
  lr: 3.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
  eps: 1.0e-8

scheduler:
  warmup_steps: 100
  min_lr: 1.0e-6

lora:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "out_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_path: "data/processed/sft/train_curated_v2.jsonl"
  val_path: "data/processed/sft/val_curated_v2.jsonl"
  context_length: 1024
  tokenizer_name: "Qwen/Qwen2.5-0.5B"
  mask_prompt: true
  num_workers: 4

checkpoint:
  checkpoint_dir: "./checkpoints_sft_v2"
  save_every: 250
  keep_last_n: 3
  save_best: true

logging:
  log_every: 10
  eval_every: 250
